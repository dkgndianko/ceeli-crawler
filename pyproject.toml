[project]
name = "ceeli-crawler"
version = "0.1.0"
description = "A package to simplify interaction with Selenium driver"
authors = [
    {name="Mouhamad Ndiankho THIAM", email="thiamouhamadpro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "selenium>=4.27.1",
]
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Os Independant"
]
keywords = [
    "selenium",
    "automation",
    "crawling",
    "scraping"
]

[project.urls]
Homepage = "https://github.com/dkgndianko/ceeli-crawler"
Source = "https://github.com/dkgndianko/ceeli-crawler"
Issues = "https://github.com/dkgndianko/ceeli-crawler/issues"

